name: Pre-flight Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check Python syntax
      run: |
        python -m py_compile main.py
        python -m py_compile preflight_check.py
    
    - name: Run preflight check
      env:
        TELEGRAM_TOKEN: test_token
        OPENROUTER_KEY: test_key
      run: |
        python preflight_check.py
    
    - name: Verify configuration files
      run: |
        test -f Procfile && echo "Procfile found"
        test -f render.yaml && echo "render.yaml found"
        test -f .env.example && echo ".env.example found"
        test -f requirements.txt && echo "requirements.txt found"
